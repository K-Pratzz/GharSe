services:
  mongodb:
    image: mongo:6.0
    container_name: gharse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: gharse

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gharse-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/gharse
      - JWT_SECRET=production_secret_key_change_in_env
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - DEFAULT_COMMISSION_PERCENT=15
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb

volumes:
  mongo_data:
